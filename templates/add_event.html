<!DOCTYPE html>
<html>
<head>
    <title>Add Training Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            width: 450px;
            border-radius: 6px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Add Training Event</h1>

    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="form-box">

        <form method="POST">

            <label for="event_name">
                Event Name
            </label>

            <input
                type="text"
                id="event_name"
                name="event_name"
                required
            >

            <label for="event_date">
                Event Date
            </label>

            <input
                type="date"
                id="event_date"
                name="event_date"
                required
            >

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                name="location"
            >

            <label for="event_type">
                Event Type
            </label>

            <select
                id="event_type"
                name="event_type"
                required
            >
                <option value="">Select type</option>
                <option value="LLAB">LLAB</option>
                <option value="PT">PT</option>
                <option value="Training">Training</option>
                <option value="Briefing">Briefing</option>
                <option value="FTX">FTX</option>
            </select>

            <label for="required">
                Required Event
            </label>

            <select
                id="required"
                name="required"
            >
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <button type="submit">
                Add Event
            </button>

        </form>

    </div>

    <p>
        <a href="/">Back to Home</a>
    </p>

</body>
</html>
