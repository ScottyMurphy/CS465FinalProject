<!DOCTYPE html>
<html>
<head>
    <title>Update Cadet Flight</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            width: 450px;
            border-radius: 6px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Update Cadet Flight</h1>

    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="form-box">

        <form method="POST">

            <label for="cadet_id">Cadet</label>

            <select
                name="cadet_id"
                id="cadet_id"
                required
            >
                <option value="">Select cadet</option>

                {% for cadet in cadets %}
                    <option value="{{ cadet['CadetID'] }}">
                        {{ cadet["LastName"] }},
                        {{ cadet["FirstName"] }}
                    </option>
                {% endfor %}
            </select>

            <label for="flight_id">New Flight</label>

            <select
                name="flight_id"
                id="flight_id"
                required
            >
                <option value="">Select flight</option>

                {% for flight in flights %}
                    <option value="{{ flight['FlightID'] }}">
                        {{ flight["FlightName"] }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">
                Update Flight
            </button>

        </form>

    </div>

    <p>
        <a href="/">Back to Home</a>
    </p>

</body>
</html>
